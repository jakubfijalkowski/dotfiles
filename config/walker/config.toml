force_keyboard_focus = true
selection_wrap = true
additional_theme_location = "~/.config/walker/themes"
theme = "custom"

[placeholders]
"default" = { input = " Search...", list = "No Results" }

[keybinds]
quick_activate = []

[providers]
default = [
  "desktopapplications"
]
empty = ["desktopapplications"]

[[providers.prefixes]]
prefix = ";"
provider = "providerlist"

[[providers.prefixes]]
prefix = ":"
provider = "symbols"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "$"
provider = "clipboard"

[[providers.prefixes]]
prefix = "?"
provider = "bluetooth"

[[providers.prefixes]]
prefix = ">"
provider = "runner"
